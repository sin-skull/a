<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2D下書き・構図ジェネレーター (ロード対策版)</title>
  <style>
    /* 
    ================================================
    開発日記ログ
    日時: 2026年8月20日 05:00 JST  
    タイトル: モバイル環境でのOpenCVロード停止問題の突破
    
    【今回の決定・変更事項】
    1. エンジン配信元の変更 (突破の根拠): 
       重くてタイムアウトしやすい公式 (docs.opencv.org) から、
       高速で安定したCDN (jsdelivr / @techstark/opencv-js) に変更。
    2. ロード状態の可視化:
       画面上部に「エンジン読込中...」等のステータスを表示し、
       いつ画像を選択して良いか、エラーが起きたかをユーザーが視認できるように改修。
    3. エラーハンドリングの追加:
       `onerror` イベントを追加し、読み込み失敗時に理由を表示。
    ================================================
    */

    :root {
      --bg: #1e1e24;
      --card: #2b2b36;
      --text: #f0f0f5;
      --accent: #4f8cff;
      --warning: #ff4f4f;
      --success: #4fff8c;
    }
    body {
      margin: 0;
      padding: 20px;
      background-color: var(--bg);
      color: var(--text);
      font-family: sans-serif;
    }
    .container {
      max-width: 1000px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    #statusBanner {
      background: var(--warning);
      color: #fff;
      padding: 10px;
      border-radius: 8px;
      text-align: center;
      font-weight: bold;
    }
    .ready {
      background: var(--success) !important;
      color: #000 !important;
    }
    .controls {
      background: var(--card);
      padding: 16px;
      border-radius: 8px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      align-items: center;
    }
    .control-item {
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 14px;
    }
    .viewport {
      position: relative;
      background: #111;
      border-radius: 8px;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 400px;
    }
    #loading {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0,0,0,0.7);
      padding: 20px;
      border-radius: 8px;
      font-weight: bold;
      z-index: 10;
      display: none;
    }
    canvas {
      max-width: 100%;
      height: auto;
      display: block;
    }
    #lineCanvas {
      position: absolute;
      top: 0;
      left: 0;
      mix-blend-mode: multiply;
      pointer-events: none;
    }
    .canvas-wrapper {
      position: relative;
      display: inline-block;
    }
    button, input[type="file"] {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 8px 12px;
      border-radius: 4px;
      cursor: pointer;
    }
  </style>
  <!-- 変更点: より安定・高速なCDNからOpenCV.jsを読み込む。エラー検知も追加 -->
  <script async src="https://cdn.jsdelivr.net/npm/@techstark/opencv-js@4.9.0/dist/opencv.js" onload="onOpenCvReady();" onerror="onOpenCvError();" type="text/javascript"></script>
</head>
<body>

<div class="container">
  <h2>下書き・構図抽出ビューア</h2>
  
  <!-- 追加点: ロード状態を視覚的に表示するバナー -->
  <div id="statusBanner">画像処理エンジンをダウンロード中...（数秒〜数十秒かかります）</div>

  <div class="controls">
    <div class="control-item">
      <label>画像を選択 / 撮影</label>
      <input type="file" id="fileInput" accept="image/*" disabled> <!-- ロード完了まで無効化 -->
    </div>
    <div class="control-item">
      <label>面(カラー)の単純化: <span id="colorVal">4</span></label>
      <input type="range" id="colorSteps" min="2" max="8" value="4">
    </div>
    <div class="control-item">
      <label>主線の太さ: <span id="lineWeightVal">5</span></label>
      <input type="range" id="lineWeight" min="3" max="15" step="2" value="5">
    </div>
    <div class="control-item">
      <label>主線の濃さ: <span id="lineDarknessVal">3.0</span></label>
      <input type="range" id="lineDarkness" min="1.0" max="10.0" step="0.5" value="3.0">
    </div>
    <div class="control-item">
      <label>線画レイヤー不透明度: <span id="lineAlphaVal">100%</span></label>
      <input type="range" id="lineAlpha" min="0" max="100" value="100">
    </div>
  </div>

  <div class="viewport">
    <div id="loading">処理中...</div>
    <div class="canvas-wrapper" id="canvasWrapper">
      <canvas id="colorCanvas"></canvas>
      <canvas id="lineCanvas"></canvas>
    </div>
  </div>
</div>

<script>
let cvReady = false;
let originalMat = null;

const statusBanner = document.getElementById('statusBanner');
const fileInput = document.getElementById('fileInput');

function onOpenCvReady() {
  cvReady = true;
  statusBanner.innerText = "エンジンの準備完了！画像を選択してください。";
  statusBanner.classList.add('ready');
  fileInput.disabled = false; // ボタンを有効化
  console.log("OpenCV.js is ready.");
}

function onOpenCvError() {
  statusBanner.innerText = "エンジンの読み込みに失敗しました。ページをリロードするか、通信環境を確認してください。";
  console.error("Failed to load OpenCV.js");
}

const colorCanvas = document.getElementById('colorCanvas');
const lineCanvas = document.getElementById('lineCanvas');
const loading = document.getElementById('loading');

fileInput.addEventListener('change', (e) => {
  if (!cvReady) return alert("画像処理エンジンのロード中です。少々お待ちください。");
  const file = e.target.files[0];
  if (!file) return;

  const img = new Image();
  img.onload = () => {
    let w = img.width;
    let h = img.height;
    const maxDim = 800; 
    if (w > maxDim || h > maxDim) {
      if (w > h) { h = Math.round((h * maxDim) / w); w = maxDim; }
      else { w = Math.round((w * maxDim) / h); h = maxDim; }
    }

    colorCanvas.width = w;
    colorCanvas.height = h;
    lineCanvas.width = w;
    lineCanvas.height = h;

    const ctx = colorCanvas.getContext('2d');
    ctx.drawImage(img, 0, 0, w, h);
    
    if (originalMat) originalMat.delete();
    originalMat = cv.imread(colorCanvas);

    processLayers();
  };
  img.src = URL.createObjectURL(file);
});

function processLayers() {
  if (!originalMat) return;
  
  loading.style.display = 'block';
  
  setTimeout(() => {
    try {
      // 1. カラー単純化
      let rgbMat = new cv.Mat();
      cv.cvtColor(originalMat, rgbMat, cv.COLOR_RGBA2RGB);
      
      let colorMat = new cv.Mat();
      cv.bilateralFilter(rgbMat, colorMat, 5, 50, 50);
      
      const steps = parseInt(document.getElementById('colorSteps').value, 10);
      const factor = 255 / steps;
      let data = colorMat.data;
      
      for (let i = 0; i < data.length; i += 3) {
        data[i]     = Math.floor(data[i] / factor) * factor;
        data[i + 1] = Math.floor(data[i + 1] / factor) * factor;
        data[i + 2] = Math.floor(data[i + 2] / factor) * factor;
      }
      
      let rgbaMat = new cv.Mat();
      cv.cvtColor(colorMat, rgbaMat, cv.COLOR_RGB2RGBA);
      cv.imshow('colorCanvas', rgbaMat);
      
      rgbMat.delete(); colorMat.delete(); rgbaMat.delete();

      // 2. 線画抽出 (DoG)
      let gray = new cv.Mat();
      cv.cvtColor(originalMat, gray, cv.COLOR_RGBA2GRAY);

      let g1 = new cv.Mat();
      let g2 = new cv.Mat();

      cv.GaussianBlur(gray, g1, new cv.Size(3, 3), 0, 0, cv.BORDER_DEFAULT);
      let ksize = parseInt(document.getElementById('lineWeight').value, 10);
      cv.GaussianBlur(gray, g2, new cv.Size(ksize, ksize), 0, 0, cv.BORDER_DEFAULT);

      let diff = new cv.Mat();
      cv.subtract(g1, g2, diff);

      let whiteBg = new cv.Mat(gray.rows, gray.cols, cv.CV_8UC1, new cv.Scalar(255));
      let edges = new cv.Mat();

      let darkness = parseFloat(document.getElementById('lineDarkness').value);
      cv.convertScaleAbs(diff, diff, darkness, 0);
      cv.subtract(whiteBg, diff, edges);

      cv.imshow('lineCanvas', edges);

      gray.delete(); g1.delete(); g2.delete(); diff.delete(); whiteBg.delete(); edges.delete();
    } catch (e) {
      console.error(e);
      alert("処理中にエラーが発生しました。別の画像を試すか、リロードしてください。");
    } finally {
      loading.style.display = 'none';
    }
  }, 50);
}

const inputs = [
  { elId: 'colorSteps', valId: 'colorVal' },
  { elId: 'lineWeight', valId: 'lineWeightVal' },
  { elId: 'lineDarkness', valId: 'lineDarknessVal' }
];

inputs.forEach(inputObj => {
  document.getElementById(inputObj.elId).addEventListener('input', (e) => {
    document.getElementById(inputObj.valId).innerText = e.target.value;
    processLayers();
  });
});

document.getElementById('lineAlpha').addEventListener('input', (e) => {
  document.getElementById('lineAlphaVal').innerText = e.target.value + '%';
  document.getElementById('lineCanvas').style.opacity = e.target.value / 100;
});
</script>
</body>
</html>
