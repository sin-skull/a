<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2D下書き・構図ジェネレーター (DoG版)</title>
  <style>
    :root {
      --bg: #1e1e24;
      --card: #2b2b36;
      --text: #f0f0f5;
      --accent: #4f8cff;
    }
    body {
      margin: 0;
      padding: 20px;
      background-color: var(--bg);
      color: var(--text);
      font-family: sans-serif;
    }
    .container {
      max-width: 1000px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .controls {
      background: var(--card);
      padding: 16px;
      border-radius: 8px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      align-items: center;
    }
    .control-item {
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 14px;
    }
    .viewport {
      position: relative;
      background: #111;
      border-radius: 8px;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 400px;
    }
    canvas {
      max-width: 100%;
      height: auto;
      display: block;
    }
    #lineCanvas {
      position: absolute;
      top: 0;
      left: 0;
      mix-blend-mode: multiply; /* 白背景を透過 */
      pointer-events: none;
    }
    .canvas-wrapper {
      position: relative;
      display: inline-block;
    }
    button, input[type="file"] {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 8px 12px;
      border-radius: 4px;
      cursor: pointer;
    }
  </style>
  <script async src="https://docs.opencv.org/4.x/opencv.js" onload="onOpenCvReady();" type="text/javascript"></script>
</head>
<body>

<div class="container">
  <h2>下書き・構図抽出ビューア (滑らか主線版)</h2>

  <div class="controls">
    <div class="control-item">
      <label>画像を選択 / 撮影</label>
      <input type="file" id="fileInput" accept="image/*">
    </div>
    <div class="control-item">
      <label>面(カラー)の単純化: <span id="colorVal">4</span></label>
      <input type="range" id="colorSteps" min="2" max="8" value="4">
    </div>
    <div class="control-item">
      <label>主線の太さ: <span id="lineWeightVal">5</span></label>
      <input type="range" id="lineWeight" min="3" max="15" step="2" value="5">
    </div>
    <div class="control-item">
      <label>主線の濃さ: <span id="lineDarknessVal">3.0</span></label>
      <input type="range" id="lineDarkness" min="1.0" max="10.0" step="0.5" value="3.0">
    </div>
    <div class="control-item">
      <label>線画レイヤー不透明度: <span id="lineAlphaVal">100%</span></label>
      <input type="range" id="lineAlpha" min="0" max="100" value="100">
    </div>
  </div>

  <div class="viewport">
    <div class="canvas-wrapper" id="canvasWrapper">
      <canvas id="colorCanvas"></canvas>
      <canvas id="lineCanvas"></canvas>
    </div>
  </div>
</div>

<script>
let cvReady = false;
let originalMat = null;

function onOpenCvReady() {
  cvReady = true;
  console.log("OpenCV.js is ready.");
}

const fileInput = document.getElementById('fileInput');
const colorCanvas = document.getElementById('colorCanvas');
const lineCanvas = document.getElementById('lineCanvas');
const colorSteps = document.getElementById('colorSteps');
const lineWeight = document.getElementById('lineWeight');
const lineDarkness = document.getElementById('lineDarkness');
const lineAlpha = document.getElementById('lineAlpha');

fileInput.addEventListener('change', (e) => {
  if (!cvReady) return alert("画像処理エンジンのロード中です。少々お待ちください。");
  const file = e.target.files[0];
  if (!file) return;

  const img = new Image();
  img.onload = () => {
    let w = img.width;
    let h = img.height;
    const maxDim = 1000;
    if (w > maxDim || h > maxDim) {
      if (w > h) { h = Math.round((h * maxDim) / w); w = maxDim; }
      else { w = Math.round((w * maxDim) / h); h = maxDim; }
    }

    colorCanvas.width = w;
    colorCanvas.height = h;
    lineCanvas.width = w;
    lineCanvas.height = h;

    const ctx = colorCanvas.getContext('2d');
    ctx.drawImage(img, 0, 0, w, h);
    
    if (originalMat) originalMat.delete();
    originalMat = cv.imread(colorCanvas);

    processLayers();
  };
  img.src = URL.createObjectURL(file);
});

function processLayers() {
  if (!originalMat) return;

  // 1. カラー単純化（面構成）処理
  const steps = parseInt(colorSteps.value, 10);
  const factor = 255 / steps;
  let colorMat = originalMat.clone();
  
  cv.bilateralFilter(originalMat, colorMat, 9, 75, 75);
  let data = colorMat.data;
  for (let i = 0; i < data.length; i += 4) {
    data[i]     = Math.floor(data[i] / factor) * factor;
    data[i + 1] = Math.floor(data[i + 1] / factor) * factor;
    data[i + 2] = Math.floor(data[i + 2] / factor) * factor;
  }
  cv.imshow('colorCanvas', colorMat);
  colorMat.delete();

  // 2. 線画抽出処理（DoG: 差分ガウシアン法）
  let gray = new cv.Mat();
  cv.cvtColor(originalMat, gray, cv.COLOR_RGBA2GRAY);

  let g1 = new cv.Mat();
  let g2 = new cv.Mat();

  // 微小なノイズを消すためのベースぼかし
  cv.GaussianBlur(gray, g1, new cv.Size(3, 3), 0, 0, cv.BORDER_DEFAULT);

  // 線の太さを決定する広範囲のぼかし
  let ksize = parseInt(lineWeight.value, 10);
  cv.GaussianBlur(gray, g2, new cv.Size(ksize, ksize), 0, 0, cv.BORDER_DEFAULT);

  // 2つのぼかし画像の差分を取る（線となるエッジ部分が明るく抽出される）
  let diff = new cv.Mat();
  cv.subtract(g1, g2, diff);

  // 白背景(255)のベースを作成
  let whiteBg = new cv.Mat(gray.rows, gray.cols, cv.CV_8UC1, new cv.Scalar(255));
  let edges = new cv.Mat();

  // 線の濃さを乗算して強調し、白背景から差し引いて黒線にする
  let darkness = parseFloat(lineDarkness.value);
  cv.convertScaleAbs(diff, diff, darkness, 0);
  cv.subtract(whiteBg, diff, edges);

  cv.imshow('lineCanvas', edges);

  // メモリ解放
  gray.delete(); g1.delete(); g2.delete(); diff.delete(); whiteBg.delete(); edges.delete();
}

// パラメータ変更イベント
const inputs = [
  { el: colorSteps, valId: 'colorVal' },
  { el: lineWeight, valId: 'lineWeightVal' },
  { el: lineDarkness, valId: 'lineDarknessVal' }
];

inputs.forEach(inputObj => {
  inputObj.el.addEventListener('input', (e) => {
    document.getElementById(inputObj.valId).innerText = e.target.value;
    processLayers();
  });
});

lineAlpha.addEventListener('input', (e) => {
  document.getElementById('lineAlphaVal').innerText = e.target.value + '%';
  lineCanvas.style.opacity = e.target.value / 100;
});
</script>
</body>
</html>
