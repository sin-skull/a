<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2D下書き・構図ジェネレーター (超軽量・外部通信なし版)</title>
  <style>
    :root {
      --bg: #1e1e24;
      --card: #2b2b36;
      --text: #f0f0f5;
      --accent: #4f8cff;
    }
    body {
      margin: 0;
      padding: 20px;
      background-color: var(--bg);
      color: var(--text);
      font-family: sans-serif;
    }
    .container {
      max-width: 1000px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .controls {
      background: var(--card);
      padding: 16px;
      border-radius: 8px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      align-items: center;
    }
    .control-item {
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 14px;
    }
    .viewport {
      position: relative;
      background: #111;
      border-radius: 8px;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 400px;
    }
    canvas {
      max-width: 100%;
      height: auto;
      display: block;
    }
    #lineCanvas {
      position: absolute;
      top: 0;
      left: 0;
      pointer-events: none;
    }
    .canvas-wrapper {
      position: relative;
      display: inline-block;
    }
    input[type="file"] {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 8px 12px;
      border-radius: 4px;
      cursor: pointer;
    }
  </style>
</head>
<body>

<div class="container">
  <h2>下書き・構図抽出 (超軽量版)</h2>

  <div class="controls">
    <div class="control-item">
      <label>画像を選択 / 撮影</label>
      <input type="file" id="fileInput" accept="image/*">
    </div>
    <div class="control-item">
      <label>面(カラー)の単純化: <span id="colorVal">4</span></label>
      <input type="range" id="colorSteps" min="2" max="8" value="4">
    </div>
    <div class="control-item">
      <label>線の抽出感度: <span id="edgeVal">50</span></label>
      <input type="range" id="edgeThreshold" min="10" max="150" value="50">
    </div>
    <div class="control-item">
      <label>線画レイヤー不透明度: <span id="lineAlphaVal">100%</span></label>
      <input type="range" id="lineAlpha" min="0" max="100" value="100">
    </div>
  </div>

  <div class="viewport">
    <div class="canvas-wrapper">
      <canvas id="colorCanvas"></canvas>
      <canvas id="lineCanvas"></canvas>
    </div>
  </div>
</div>

<script>
const fileInput = document.getElementById('fileInput');
const colorCanvas = document.getElementById('colorCanvas');
const lineCanvas = document.getElementById('lineCanvas');
const ctxColor = colorCanvas.getContext('2d', { willReadFrequently: true });
const ctxLine = lineCanvas.getContext('2d', { willReadFrequently: true });

let originalImageData = null;
let currentWidth = 0;
let currentHeight = 0;

fileInput.addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;

  const img = new Image();
  img.onload = () => {
    // 処理を軽くするため最大600pxにリサイズ
    let w = img.width;
    let h = img.height;
    const maxDim = 600; 
    if (w > maxDim || h > maxDim) {
      if (w > h) { h = Math.round((h * maxDim) / w); w = maxDim; }
      else { w = Math.round((w * maxDim) / h); h = maxDim; }
    }

    currentWidth = w;
    currentHeight = h;
    colorCanvas.width = w;
    colorCanvas.height = h;
    lineCanvas.width = w;
    lineCanvas.height = h;

    ctxColor.drawImage(img, 0, 0, w, h);
    originalImageData = ctxColor.getImageData(0, 0, w, h);

    processImage();
  };
  img.src = URL.createObjectURL(file);
});

function processImage() {
  if (!originalImageData) return;

  const steps = parseInt(document.getElementById('colorSteps').value, 10);
  const threshold = parseInt(document.getElementById('edgeThreshold').value, 10);
  
  const w = currentWidth;
  const h = currentHeight;
  
  // カラー用と線画用のデータを準備
  const colorData = new Uint8ClampedArray(originalImageData.data);
  const lineImgData = ctxLine.createImageData(w, h);
  const lineData = lineImgData.data;
  
  const factor = 255 / steps;
  
  // グレースケール変換用配列（エッジ検出用）
  const gray = new Uint8Array(w * h);

  // 1. カラー単純化（ポスタリゼーション）とグレースケール化を同時に実行
  for (let i = 0; i < colorData.length; i += 4) {
    let r = colorData[i];
    let g = colorData[i+1];
    let b = colorData[i+2];
    
    // グレースケール保存
    gray[i/4] = r * 0.299 + g * 0.587 + b * 0.114;

    // 色の単純化
    colorData[i]   = Math.floor(r / factor) * factor;
    colorData[i+1] = Math.floor(g / factor) * factor;
    colorData[i+2] = Math.floor(b / factor) * factor;
  }

  // カラーキャンバスに描画
  const newColorImgData = new ImageData(colorData, w, h);
  ctxColor.putImageData(newColorImgData, 0, 0);

  // 2. 線画抽出（Sobelフィルタ）
  const gx = [-1, 0, 1, -2, 0, 2, -1, 0, 1];
  const gy = [-1, -2, -1, 0, 0, 0, 1, 2, 1];

  for (let y = 1; y < h - 1; y++) {
    for (let x = 1; x < w - 1; x++) {
      let sumX = 0;
      let sumY = 0;
      
      for (let ky = -1; ky <= 1; ky++) {
        for (let kx = -1; kx <= 1; kx++) {
          const val = gray[(y + ky) * w + (x + kx)];
          const weightX = gx[(ky + 1) * 3 + (kx + 1)];
          const weightY = gy[(ky + 1) * 3 + (kx + 1)];
          sumX += val * weightX;
          sumY += val * weightY;
        }
      }
      
      const magnitude = Math.sqrt(sumX * sumX + sumY * sumY);
      const i = (y * w + x) * 4;
      
      if (magnitude > threshold) {
        // エッジ（黒い線）
        lineData[i] = 0;   // R
        lineData[i+1] = 0; // G
        lineData[i+2] = 0; // B
        lineData[i+3] = 255; // Alpha
      } else {
        // 背景（透明にして下のカラーを透けさせる）
        lineData[i+3] = 0; // Alpha 0
      }
    }
  }

  ctxLine.putImageData(lineImgData, 0, 0);
}

// イベントリスナー
['colorSteps', 'edgeThreshold'].forEach(id => {
  document.getElementById(id).addEventListener('input', (e) => {
    document.getElementById(id === 'colorSteps' ? 'colorVal' : 'edgeVal').innerText = e.target.value;
    processImage();
  });
});

document.getElementById('lineAlpha').addEventListener('input', (e) => {
  document.getElementById('lineAlphaVal').innerText = e.target.value + '%';
  document.getElementById('lineCanvas').style.opacity = e.target.value / 100;
});
</script>
</body>
</html>
