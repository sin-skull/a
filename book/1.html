<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>本棚</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;600;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- サイドバー -->
<div id="sidebarOverlay" class="sidebar-overlay"></div>
<div id="sidebarMenu" class="sidebar-menu">
  <div class="sidebar-header">メニュー</div>
  <button class="nav-btn active" data-target="view-bookshelf">📚 マイ本棚</button>
  <button class="nav-btn" data-target="view-search">🔍 本を追加する</button>
  
  <div class="sidebar-header" style="font-size: 14px; margin-top: 10px; border-top: 1px solid var(--accent); padding-top:16px;">読書データ</div>
  <div style="padding: 10px 20px; font-size: 13px; line-height: 1.8;">
    <div>全登録数: <span id="stat-total" style="font-weight:bold; color:var(--accent);">0</span> 冊</div>
    <div>📖 読み中: <span id="stat-reading">0</span> 冊</div>
    <div>✅ 読了済: <span id="stat-done">0</span> 冊</div>
    <div>📚 積読/購入済: <span id="stat-owned">0</span> 冊</div>
    <div>🛒 欲しい: <span id="stat-want">0</span> 冊</div>
  </div>

  <div class="sidebar-header" style="font-size: 14px; border-top: 1px solid var(--accent); padding-top:16px;">表示サイズ (一括設定)</div>
  <div class="sidebar-settings">
    <label><span>表紙の数:</span><span id="lblCoverCount">4 冊</span></label>
    <input type="range" id="inpCoverCount" min="2" max="8" value="4">
    <label><span>背表紙の数:</span><span id="lblSpineCount">12 冊</span></label>
    <input type="range" id="inpSpineCount" min="5" max="30" value="12">
  </div>

  <div class="sidebar-header" style="font-size: 14px; border-top: 1px solid var(--accent); padding-top:16px;">テーマカラー</div>
  <div style="padding: 10px 20px;">
    <button class="theme-btn" data-set-theme="default">🪵 木目調（デフォルト）</button>
    <button class="theme-btn" data-set-theme="white">⚪️ ホワイト</button>
    <button class="theme-btn" data-set-theme="black">⚫️ ダーク</button>
  </div>

  <div class="sidebar-header" style="font-size: 14px; border-top: 1px solid var(--accent); padding-top:16px;">データ管理</div>
  <div style="padding: 10px 20px;">
    <button class="theme-btn" id="exportDataBtn" type="button" style="margin-bottom:8px;">💾 データをバックアップ</button>
    <button class="theme-btn" id="importDataBtn" type="button" style="margin-bottom:16px;">📥 データを復元 (読込)</button>
    <input type="file" id="importFileInput" accept=".json" hidden>
    <button class="theme-btn" id="clearHistoryBtn" type="button">🗑 スタンプ・サイン履歴を消去</button>
  </div>
</div>

<!-- ヘッダー -->
<header>
  <div class="header-left">
    <button id="menuBtn" class="icon-btn">≡</button>
    <h1 id="headerTitle">マイ本棚</h1>
  </div>
  <div class="header-icons" id="bookshelfIcons">
    <button id="toggleFilterBtn" title="本棚内を検索">🔎</button>
    <button id="togglePopBtn" title="サイン・スタンプ表示（タップで4段階切替）">👀</button>
    <button id="toggleMoveBtn" title="本を移動（タップで持ち上げ→タップで置く）">✥</button>
    <button id="toggleEditBtn" title="編集モード">✏️</button>
  </div>
  <div class="header-icons" id="searchIcons" style="display:none;">
    <button class="btn" id="bulkAddBtn">一括追加 (<span id="queueCount">0</span>)</button>
  </div>
</header>

<div id="app">
  <!-- ==================== 本棚ビュー ==================== -->
  <div id="view-bookshelf" class="view active">
    <div id="filterBar" style="display: none; padding: 10px 16px; background: rgba(0,0,0,0.1); border-bottom: 1px solid var(--accent);">
      <input type="text" id="filterInput" placeholder="タイトル、ジャンル、タグで検索..." style="width: 100%; padding: 8px; border-radius: 4px; border: 1px solid var(--accent); background: var(--case-bg); color: var(--text-main); font-size: 14px;">
    </div>
    
    <div class="edit-tools" id="editTools" style="display: none;">
      <button class="btn ghost" id="flipModeBtn">表示切替(表紙/背): OFF</button>
      <button class="btn ghost" id="stampMenuBtn" title="スタンプ追加">☻</button>
      <button class="btn ghost" id="addCaseBtnHeader" title="本棚を追加">＋</button>
      <input type="file" id="stampFileInput" accept="image/*" hidden>
      <p class="edit-hint">いつでも段を長押しすれば全ての段に＋／⚙️（サイズ個別設定）／×が表示されます</p>
    </div>

    <div class="cases-row" id="casesRow"></div>
    <div class="pagination-dots" id="paginationDots"></div>
  </div>

  <!-- ==================== 追加ビュー ==================== -->
  <div id="view-search" class="view">
    <div class="search-container">
      <div class="scan-mode-toggle">
        <button class="btn" id="modeScanBtn">カメラで連続スキャン</button>
        <button class="btn ghost" id="modeInputBtn">手動・タイトル検索</button>
      </div>
      
      <div id="scanArea">
        <div class="scan-wrap" id="scanContainer"></div>
        <p style="font-size:12px; text-align:center; opacity:0.8;" id="scanHint">バーコードを枠内に収めてください</p>
      </div>
      
      <div id="inputArea" hidden>
        <div class="manual-input-wrap">
          <input type="text" id="manualIsbn" placeholder="ISBN または タイトル を入力">
          <button class="btn" id="manualSearchBtn">検索</button>
        </div>
        <p style="font-size:11px; opacity:0.7; margin-top:-8px;">※タイトル入力の場合、少し時間がかかることがあります。</p>
      </div>
      
      <div class="queue-list" id="queueList"></div>
    </div>
  </div>
</div>

<!-- ==================== モーダル (詳細・編集用) ==================== -->
<div class="modal hidden" id="bookModal">
  <div class="modal-card">
    <h2 id="bm-title" style="margin-top:0; font-size:16px;">詳細</h2>
    
    <div class="bm-top-row">
      <div class="modal-cover-wrap" id="bm-cover-wrap"></div>
      <div class="bm-synopsis-wrap read-only">
        <div class="bm-synopsis" id="bm-synopsis"></div>
        <button class="btn ghost bm-synopsis-toggle" id="bm-synopsis-toggle" type="button" hidden>続きを読む</button>
      </div>
    </div>
    
    <div class="meta-group">
      <p class="meta-line" id="bm-author"></p>
      <p class="meta-line" id="bm-publisher"></p>
      <p class="meta-line" id="bm-isbn"></p>
    </div>

    <div class="field edit-only">
      <label>あらすじを編集</label>
      <textarea id="bm-synopsis-input" rows="4" placeholder="あらすじを入力・貼り付け"></textarea>
      <a id="bm-google-desc" href="#" target="_blank" rel="noopener" class="google-img-link">ブラウザであらすじを検索してコピーする ↗</a>
    </div>

    <div class="field">
      <label>メモ（感想など）</label>
      <div id="bm-memo-text" class="read-only-memo read-only"></div>
      <textarea id="bm-memo" class="edit-only" rows="3" placeholder="読んだ感想を書いておけます"></textarea>
    </div>
    
    <div class="field">
      <label>付与されたジャンル・タグ</label>
      <div id="bm-tags"></div>
      
      <div class="edit-only" style="margin-top:10px;margin-bottom:0;">
        <label>追加設定 (ジャンル / タグ / 背景マーク)</label>
        <div style="display:flex; gap:6px;">
          <select id="bm-genre-select" style="flex:1; padding:8px; font-size:13px;"></select>
          <select id="bm-tag-select" style="flex:1; padding:8px; font-size:13px;"></select>
          <select id="bm-bgtag" style="flex:1; padding:8px; font-size:13px;"></select>
        </div>
      </div>
    </div>

    <div id="editOnlyFields" class="edit-only">
      <div class="field">
        <label>表紙・画像URL</label>
        <input id="bm-cover-input">
        <div style="margin-top: 6px;">
          <a id="bm-google-img" href="#" target="_blank" rel="noopener" class="google-img-link">Google画像検索で探す ↗</a>
          <a id="bm-hanmoto-link" href="#" target="_blank" rel="noopener" class="google-img-link" style="margin-left: 12px;">版元ドットコムで開く ↗</a>
        </div>
      </div>
      <div class="field">
        <label>サイズ (本の場合)</label>
        <select id="bm-size">
          <option value="s">S (文庫)</option>
          <option value="m">M (単行本)</option>
          <option value="l">L (大型本)</option>
        </select>
      </div>
      <div class="field">
        <label>状態</label>
        <select id="bm-status">
          <option value="want">欲しい</option>
          <option value="owned">購入済み</option>
          <option value="reading">読み中</option>
          <option value="done">済</option>
        </select>
      </div>
    </div>
    
    <div class="modal-actions">
      <button class="btn ghost" id="bm-close">閉じる</button>
      <button class="btn danger edit-only" id="bm-delete">削除</button>
    </div>
  </div>
</div>

<div class="modal hidden" id="stampMenu">
  <div class="modal-card">
    <h2 style="margin-top:0; font-size:16px;">☻ スタンプを追加</h2>
    <div class="stamp-menu-actions">
      <button class="btn ghost" id="stampMenuFile">📁 ファイル</button>
      <button class="btn ghost" id="stampMenuUrl">🔗 URL</button>
      <button class="btn ghost" id="stampMenuText">📝 テキスト</button>
    </div>
    <p class="edit-hint" style="margin:14px 0 4px;">履歴（タップで再利用）</p>
    <div id="stampMenuHistory" class="stamp-history-list"></div>
    <div class="modal-actions">
      <button class="btn ghost" id="stampMenuClose">閉じる</button>
    </div>
  </div>
</div>

<div class="modal hidden" id="signModal">
  <div class="modal-card">
    <h2 style="margin-top:0; font-size:16px;">サインの文字</h2>
    <div class="field">
      <input id="signTextInput" list="signHistoryList" placeholder="例：社会 政治">
      <datalist id="signHistoryList"></datalist>
    </div>
    <div class="modal-actions">
      <button class="btn ghost" id="signCancelBtn">キャンセル</button>
      <button class="btn danger" id="signDeleteBtn" hidden>削除</button>
      <button class="btn" id="signSaveBtn">保存</button>
    </div>
  </div>
</div>

<!-- 段の個別設定用モーダル -->
<div class="modal hidden" id="rowSettingsModal">
  <div class="modal-card">
    <h2 style="margin-top:0; font-size:16px;">段の個別サイズ設定</h2>
    <div class="sidebar-settings" style="padding: 0 0 16px 0; border: none;">
      <label><span>表紙の数:</span><span id="rs-lblCoverCount">4 冊</span></label>
      <input type="range" id="rs-inpCoverCount" min="2" max="8" value="4">
      <label><span>背表紙の数:</span><span id="rs-lblSpineCount">12 冊</span></label>
      <input type="range" id="rs-inpSpineCount" min="5" max="30" value="12">
    </div>
    <button class="btn ghost danger-outline" id="rs-resetBtn" style="width:100%; margin-bottom:16px;">個別設定を解除して全体に合わせる</button>
    <div class="modal-actions">
      <button class="btn" id="rs-closeBtn">完了</button>
    </div>
  </div>
</div>

<div class="toast hidden" id="toast"></div>

<!-- 削除用ゴミ箱エリア -->
<div id="trash-area">ゴミ箱</div>

<!-- 動的に生成するCSS変数用のstyleタグ -->
<style id="dynamicStyles"></style>

<!-- 外部ライブラリとスクリプト -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/quagga/0.12.1/quagga.min.js"></script>
<script src="script.js"></script>
</body>
</html>
